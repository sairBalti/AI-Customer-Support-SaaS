# Local development infrastructure (free / offline-friendly).
# Services: MySQL 8, Redis 7, FastAPI backend.
#
# Prerequisites: Docker Desktop (or Engine) + Docker Compose v2
# Do not put production secrets in this file; override via root `.env`.

name: ai-customer-support

services:
  mysql:
    image: mysql:8.4
    container_name: acs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_customer_support}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: acs-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acs-backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      # Docker DNS hostnames (override localhost values from backend/.env)
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-user}:${MYSQL_PASSWORD:-password}@mysql:3306/${MYSQL_DATABASE:-ai_customer_support}
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /app/.storage
      CHROMA_PERSIST_DIR: /app/.chroma
      STORAGE_PROVIDER: local
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      AUTH_HEADER_BYPASS: ${AUTH_HEADER_BYPASS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - backend_storage:/app/.storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  mysql_data:
  redis_data:
  backend_storage:
